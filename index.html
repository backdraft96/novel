<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>댐 — 장편소설</title>
  <meta name="description" content="장편소설 「댐」 — 수몰지구 사람들의 이야기. 전자책으로 읽고 방명록을 남겨 주세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <script>window.DAM_SKIP_AUTO_PING = true;</script>
  <script src="site-config.js"></script>
  <style>
    :root {
      --bg: #fafaf7;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #1e3a5f;
      --accent-hover: #132742;
      --gold: #c5a059;
      --border: #e7e5e4;
      --soft: #f3f1ec;
      --danger: #b91c1c;
      --serif: 'Noto Serif KR', Georgia, serif;
      --sans: 'Noto Sans KR', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316;
        --card: #1e2025;
        --text: #dcdcdc;
        --muted: #95989e;
        --accent: #4a88d9;
        --accent-hover: #6ca5ea;
        --border: #2d3039;
        --soft: #16181c;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      word-break: keep-all;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }
    a { color: inherit; }
    .wrap { max-width: 680px; margin: 0 auto; padding: clamp(20px, 5vw, 40px) 16px 48px; }

    /* ── 표지 영역 ── */
    .hero { text-align: center; }
    .cover {
      display: block;
      width: min(68vw, 280px);
      aspect-ratio: 1 / 1.48;
      margin: 0 auto 24px;
      border-radius: 18px;
      padding: 22px;
      color: #f1f5f9;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #091322 0%, #152d4a 45%, #244669 70%, #0d1e33 100%);
      box-shadow: 0 24px 48px -12px rgba(9, 19, 34, 0.55);
      border: 1px solid rgba(71, 85, 105, 0.6);
      transition: transform 0.2s ease;
    }
    .cover:active { transform: scale(0.98); }
    .cover::before {
      content: ''; position: absolute; bottom: 25%; left: -20%; right: -20%; height: 45%;
      background: radial-gradient(ellipse at center, rgba(197, 160, 89, 0.25) 0%, rgba(30, 58, 95, 0) 70%);
      transform: skewY(-4deg);
    }
    .cover::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
      background: linear-gradient(180deg, rgba(13, 30, 51, 0.3) 0%, rgba(5, 12, 22, 0.9) 100%);
      border-top: 1px solid rgba(197, 160, 89, 0.3);
    }
    .cover-inner { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    .cover-tag {
      align-self: flex-start;
      font-size: 10.5px; padding: 3px 10px; border-radius: 999px;
      background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .cover h1 {
      font-family: var(--serif); font-weight: 900; margin: 0 0 12px;
      font-size: clamp(2.6rem, 13vw, 3.4rem); letter-spacing: 0.2em; text-indent: 0.2em;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }
    .cover .bar { width: 56px; height: 2px; background: #fbbf24; opacity: 0.8; margin: 0 auto 12px; }
    .cover .by { font-family: var(--serif); font-size: 13px; color: #cbd5e1; margin: 0; }
    .cover .foot { font-size: 10.5px; color: rgba(203, 213, 225, 0.8); letter-spacing: 0.05em; }

    .intro { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
    .cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 0 26px; border-radius: 999px;
      font: 700 16px/1 var(--sans); text-decoration: none; cursor: pointer;
      border: 1.5px solid transparent; transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px -8px rgba(30, 58, 95, 0.7); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: var(--card); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--accent); }

    /* ── 방문자 수 ── */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 36px 0 0;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px 12px; text-align: center;
    }
    .stat-label { font-size: 13px; color: var(--muted); font-weight: 500; }
    .stat-num {
      font-family: var(--serif); font-weight: 700; font-size: clamp(1.6rem, 7vw, 2rem);
      color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.3;
    }
    .stat-note { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--muted); margin: -2px 0 0; }

    /* ── 방명록 ── */
    .section { margin-top: 44px; }
    .section h2 {
      font-family: var(--serif); font-size: 1.35rem; margin: 0 0 4px;
      display: flex; align-items: baseline; gap: 8px;
    }
    .section h2 small { font-family: var(--sans); font-size: 13px; color: var(--muted); font-weight: 500; }
    .section .desc { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

    .form {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px;
    }
    .form label { display: block; font-size: 13px; font-weight: 700; margin: 0 0 6px; }
    .form input[type=text], .form textarea {
      width: 100%; font: 16px/1.6 var(--sans); color: var(--text);
      background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px;
      outline: none; transition: border-color 0.15s;
    }
    .form input[type=text]:focus, .form textarea:focus { border-color: var(--accent); }
    .form textarea { min-height: 110px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .form .btn { min-height: 48px; padding: 0 22px; font-size: 15px; }
    .form .btn[disabled] { opacity: 0.55; cursor: default; }
    .msg { font-size: 13px; margin: 10px 0 0; min-height: 1em; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: #15803d; }

    .list { list-style: none; margin: 18px 0 0; padding: 0; }
    .item { border-bottom: 1px solid var(--border); padding: 16px 4px; }
    .item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .item-name { font-weight: 700; font-size: 15px; }
    .item-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .item-body { font-family: var(--serif); font-size: 15.5px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty, .notice { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 8px; }
    .more { display: flex; justify-content: center; margin-top: 16px; }
    .more[hidden] { display: none; }

    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 48px; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 표지 -->
    <section class="hero">
      <a class="cover" href="cover.html" aria-label="표지로 들어가기">
        <div class="cover-inner">
          <span class="cover-tag">장편소설</span>
          <div>
            <h1>댐</h1>
            <div class="bar"></div>
            <p class="by">윤인 원작 극본 댐 소설화</p>
          </div>
          <div class="foot">수몰지구 사람들의 이야기</div>
        </div>
      </a>
      <p class="intro">물에 잠길 땅, 그 위에 살았던 사람들의 이야기</p>
      <div class="cta">
        <a class="btn btn-primary" href="chapter-01.html">첫 장부터 읽기 <span aria-hidden="true">▶</span></a>
        <a class="btn btn-ghost" href="cover.html">표지·목차 보기</a>
      </div>
    </section>

    <!-- 방문자 수 -->
    <section class="stats" aria-label="방문자 수">
      <div class="stat">
        <div class="stat-label">오늘 방문자</div>
        <div class="stat-num" id="stat-today">–</div>
      </div>
      <div class="stat">
        <div class="stat-label">전체 방문자</div>
        <div class="stat-num" id="stat-total">–</div>
      </div>
      <p class="stat-note" id="stat-note"></p>
    </section>

    <!-- 방명록 -->
    <section class="section" id="guestbook">
      <h2>방명록 <small id="gb-count"></small></h2>
      <p class="desc">읽은 소감이나 응원의 한마디를 남겨 주세요.</p>

      <form class="form" id="gb-form" novalidate>
        <div class="field">
          <label for="gb-name">이름(별명)</label>
          <input type="text" id="gb-name" maxlength="20" autocomplete="nickname" placeholder="예) 수몰지구 독자">
        </div>
        <div class="field">
          <label for="gb-message">남길 말</label>
          <textarea id="gb-message" maxlength="500" placeholder="자유롭게 적어 주세요. (최대 500자)"></textarea>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="gb-website">웹사이트</label>
          <input type="text" id="gb-website" tabindex="-1" autocomplete="off">
        </div>
        <div class="form-row">
          <span class="count"><span id="gb-len">0</span> / 500</span>
          <button type="submit" class="btn btn-primary" id="gb-submit">남기기</button>
        </div>
        <p class="msg" id="gb-msg" role="status"></p>
      </form>

      <ul class="list" id="gb-list"></ul>
      <div class="more" id="gb-more-wrap" hidden>
        <button type="button" class="btn btn-ghost" id="gb-more">더 보기</button>
      </div>
    </section>

    <footer>© 장편소설 「댐」</footer>
  </div>

  <script>
  (function () {
    var API = (window.DAM_SITE && window.DAM_SITE.API_URL) || '';
    var PAGE = 10;
    var offset = 0;

    var $ = function (id) { return document.getElementById(id); };
    var fmt = function (n) { return Number(n || 0).toLocaleString('ko-KR'); };

    /* ── 방문자 수 ── */
    function loadStats() {
      if (!API) {
        $('stat-note').textContent = '방문자 집계는 설정 후 표시됩니다.';
        return;
      }
      var isNew = window.DAM_SITE.isNewToday;
      fetch(API + '?action=' + (isNew ? 'hit' : 'stats'))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error(d.error);
          $('stat-today').textContent = fmt(d.stats.today);
          $('stat-total').textContent = fmt(d.stats.total);
          if (isNew && window.DAM_SITE.markVisited) window.DAM_SITE.markVisited();
        })
        .catch(function () { $('stat-note').textContent = '방문자 수를 불러오지 못했습니다.'; });
    }

    /* ── 방명록 목록 ── */
    function renderItem(it) {
      var li = document.createElement('li');
      li.className = 'item';
      var head = document.createElement('div');
      head.className = 'item-head';
      var name = document.createElement('span');
      name.className = 'item-name';
      name.textContent = it.name;
      var time = document.createElement('span');
      time.className = 'item-time';
      time.textContent = it.time;
      head.appendChild(name);
      head.appendChild(time);
      var body = document.createElement('div');
      body.className = 'item-body';
      body.textContent = it.message;
      li.appendChild(head);
      li.appendChild(body);
      return li;
    }

    function loadList(reset) {
      var list = $('gb-list');
      if (!API) {
        list.innerHTML = '<li class="notice">방명록은 설정이 끝나면 사용할 수 있습니다.</li>';
        $('gb-submit').disabled = true;
        return;
      }
      if (reset) { offset = 0; }
      $('gb-more').disabled = true;
      fetch(API + '?action=list&offset=' + offset + '&limit=' + PAGE)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error(d.error);
          if (reset) list.innerHTML = '';
          if (d.total === 0) {
            list.innerHTML = '<li class="empty">아직 남겨진 글이 없습니다. 첫 번째 글을 남겨 주세요.</li>';
          }
          d.items.forEach(function (it) { list.appendChild(renderItem(it)); });
          offset += d.items.length;
          $('gb-count').textContent = d.total ? d.total + '개의 글' : '';
          $('gb-more-wrap').hidden = offset >= d.total;
          $('gb-more').disabled = false;
        })
        .catch(function () {
          if (reset) list.innerHTML = '<li class="notice">방명록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</li>';
          $('gb-more').disabled = false;
        });
    }

    /* ── 방명록 쓰기 ── */
    var msgEl = $('gb-message');
    msgEl.addEventListener('input', function () { $('gb-len').textContent = msgEl.value.length; });

    $('gb-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!API) return;
      var out = $('gb-msg');
      var name = $('gb-name').value.trim();
      var message = msgEl.value.trim();
      out.className = 'msg err';
      if (!name) { out.textContent = '이름(별명)을 입력해 주세요.'; $('gb-name').focus(); return; }
      if (message.length < 2) { out.textContent = '남길 말을 두 글자 이상 입력해 주세요.'; msgEl.focus(); return; }

      var btn = $('gb-submit');
      btn.disabled = true;
      btn.textContent = '저장 중…';
      out.className = 'msg';
      out.textContent = '';

      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name: name, message: message, website: $('gb-website').value })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error(d.error || '저장하지 못했습니다.');
          msgEl.value = '';
          $('gb-len').textContent = '0';
          out.className = 'msg ok';
          out.textContent = '남겨 주셔서 고맙습니다.';
          try { localStorage.setItem('dam_gb_name', name); } catch (x) {}
          loadList(true);
        })
        .catch(function (err) {
          out.className = 'msg err';
          out.textContent = (err && err.message && !/fetch|JSON/i.test(err.message)) ? err.message : '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = '남기기';
        });
    });

    $('gb-more').addEventListener('click', function () { loadList(false); });

    try { var saved = localStorage.getItem('dam_gb_name'); if (saved) $('gb-name').value = saved; } catch (x) {}

    loadStats();
    loadList(true);
  })();
  </script>
</body>
</html>
